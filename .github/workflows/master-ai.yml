# CI gates of the AI branches (master_ai, master_ai_cpu). Written with AI assistance; not part of the
# ALF baseline. See HOOKS.md and Documentation/lowrank.tex.
#  - hook_lint:      baseline files differ from ALF master only by the hooks listed in HOOKS.md
#  - baseline_guard: a build without AI switches gives output bit-identical to ALF master
#  - lowrank:        the LOWRANK feature builds with every compiler of the test matrix (Devel flags)
#                    and passes its unit test and the scheme comparison (byte-identical final configuration
#                    and observables to 1e-8 against the standard update); GNU also with TEMPERING,
#                    PARALLEL_PARAMS and HDF5
name: "AI branch gates"

on:
  push:
    branches: [master_ai, master_ai_cpu, "ai/**"]
  workflow_dispatch:

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook_lint:
    name: Hook lint (HOOKS.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch ALF master
        run: git fetch --no-tags https://github.com/ALF-QMC/ALF.git master:refs/remotes/upstream/master
      - name: Check hooks
        run: python3 testsuite/hook_lint.py --base upstream/master

  baseline_guard:
    name: Baseline guard (bit-identical to ALF master, GNU serial)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alf-qmc/alf-container/alf-requirements/trixie
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build ALF master and this branch without AI switches
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch --no-tags https://github.com/ALF-QMC/ALF.git master:refs/remotes/upstream/master
          git worktree add ../alf_master upstream/master
          for d in ../alf_master .; do
            (cd "$d" && . ./configure.sh GNU noMPI NO-INTERACTIVE && make -j4 lib program)
          done
      - name: Compare all output
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
        run: |
          python3 testsuite/baseline_guard.py --ref ../alf_master/Prog/ALF.out --test Prog/ALF.out \
            --start ../alf_master/Scripts_and_Parameters_files/Start --work ../guard_runs --max-bins 2

  lowrank:
    name: LOWRANK · ${{ matrix.image_minor[1] }} · ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_minor:
          - [trixie, GNU]
          - [bookworm-pgi-24-09, PGI]
          - [bookworm-intel-2024.2, INTEL]
          - [bookworm-intel, INTELLLVM]
        mode: [noMPI, MPI]
        include:
          - image_minor: [trixie, GNU]
            mode: TEMPERING
          - image_minor: [trixie, GNU]
            mode: PARALLEL_PARAMS
          - image_minor: [trixie, GNU]
            mode: noMPI HDF5
    container:
      image: ghcr.io/alf-qmc/alf-container/alf-requirements/${{ matrix.image_minor[0] }}
    steps:
      - uses: actions/checkout@v6
      - name: Build with LOWRANK (Devel flags)
        shell: bash
        run: |
          # test-only Hamiltonians of the suite (multi-site and 10-site vertices, continuous + discrete fields)
          testsuite/Lowrank.tests/add_test_models.sh .
          . ./configure.sh ${{ matrix.image_minor[1] }} ${{ matrix.mode }} LOWRANK Devel NO-INTERACTIVE
          make -j4 lib program
          # CMake wants a bare compiler name: "mpiifort -fc=ifx" is the wrapper mpiifx
          if [[ "$ALF_FC" == "mpiifort -fc=ifx" ]]; then export ALF_FC=mpiifx; fi
          cmake -S testsuite -B testsuite/tests
          cmake --build testsuite/tests -j4 --target 36-lowrank-unit
      - name: Unit test and scheme comparison
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
        run: |
          . ./configure.sh ${{ matrix.image_minor[1] }} ${{ matrix.mode }} LOWRANK Devel NO-INTERACTIVE
          # CMake wants a bare compiler name: "mpiifort -fc=ifx" is the wrapper mpiifx
          if [[ "$ALF_FC" == "mpiifort -fc=ifx" ]]; then export ALF_FC=mpiifx; fi
          ctest --test-dir testsuite/tests -R lowrank -E full --output-on-failure
      - name: Scheme comparison, all scenarios (GNU, serial)
        if: matrix.image_minor[1] == 'GNU' && matrix.mode == 'noMPI'
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
        run: |
          . ./configure.sh GNU noMPI LOWRANK Devel NO-INTERACTIVE
          ctest --test-dir testsuite/tests -R lowrank-compare-schemes-full --output-on-failure
